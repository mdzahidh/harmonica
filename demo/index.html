</style></head><body><main>
<h1>The key's neighbourhood (reference)</h1>
<p class="lead">Exact copy of the live widgets in the Harmonic Grid book, Chapter 7. Open this file directly in a browser.</p>
<div data-widget="display-settings"></div>
<h2>Neighbourhood map</h2>
<div data-widget="neighbour-map" data-from="0|"></div>
<h2>VL × TD plot and table</h2>
<div data-widget="chord-neighbours" data-from="0|"></div>
<h2>Any two chords</h2>
<div data-widget="chord-distance" data-from="0|" data-to="7|"></div>
</main><script>// Interactive layer for the HTML book (harmonic-grid-book.html). Inlined by book_html.py.
// CD = chord distance: the same VL / TD as assets/chord_distance.py (checked against it with
// `python3 chord_distance.py --check-js`). UI: sortable tables, contents sidebar, image zoom,
// and the widgets placed in the markdown as <div data-widget="...">.

const CD = (() => {
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const L3 = Math.log2(3), L5 = Math.log2(5);
  const SHAPES = { '': [[0, 0], [0, 1], [1, 0]], m: [[0, 0], [1, -1], [1, 0]], '°': [[0, 0], [1, -1], [2, -2]] };
  // the key's own chords, by fret above the tonic (natural minor for a minor tonic)
  const KEY_STEPS = { '': [[0, '', 'I'], [2, 'm', 'ii'], [4, 'm', 'iii'], [5, '', 'IV'], [7, '', 'V'], [9, 'm', 'vi'], [11, '°', 'vii°']],
    m: [[0, 'm', 'i'], [2, '°', 'ii°'], [3, '', 'III'], [5, 'm', 'iv'], [7, 'm', 'v'], [8, '', 'VI'], [10, '', 'VII']] };
  const keyOf = (root, kind) => new Map(KEY_STEPS[kind].map(([d, k, rn]) => [`${(root + d) % 12}|${k}`, rn]));
  const POS = { 0: 0, 7: 1, 2: 2, 9: 3, 4: 4, 11: 5, 6: 6, 1: -5, 8: -4, 3: -3, 10: -2, 5: -1 };
  const mod = (n, m) => ((n % m) + m) % m;
  const fret = p => mod(7 * p[0] + 4 * p[1], 12);
  const kees = (k, j) => (k * j >= 0 ? Math.abs(k) * L3 + Math.abs(j) * L5
    : Math.max(Math.abs(k) * L3, Math.abs(j) * L5));
  const oddLimit = (k, j) => {            // odd limit of 3^k 5^j
    let n = 3 ** Math.max(k, 0) * 5 ** Math.max(j, 0);
    let d = 3 ** Math.max(-k, 0) * 5 ** Math.max(-j, 0);
    return Math.max(n, d);
  };
  const short = (a, b) => Math.min(mod(a - b, 12), mod(b - a, 12));
  const perms = a => a.length <= 1 ? [a] :
    a.flatMap((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(r => [x, ...r]));
  const chord = (root, kind) => SHAPES[kind].map(p => [POS[root] + p[0], p[1]]);
  const name = (root, kind) => NAMES[root] + kind;

  function vl(X, Y) {
    const fx = X.map(fret);
    let best = null;
    for (const P of perms(Y.map(fret))) {
      const t = fx.reduce((s, x, i) => s + short(x, P[i]), 0);
      if (!best || t < best.total) best = { total: t, pairs: fx.map((x, i) => [x, P[i]]) };
    }
    best.moves = best.pairs.filter(([a, b]) => a !== b)
      .map(([a, b]) => ({ from: NAMES[a], to: NAMES[b], cost: short(a, b) }));
    return best;
  }

  function td(X, Y, win = 4) {
    let best = null;
    for (let da = -12; da <= 12; da++) for (let db = -win; db <= win; db++) {
      if (mod(7 * da + 4 * db, 12)) continue;
      const Yc = Y.map(p => [p[0] + da, p[1] + db]);
      for (const P of perms(Yc)) {
        let c = 0, held = 0;
        X.forEach((p, i) => {
          c += kees(P[i][0] - p[0], P[i][1] - p[1]);
          held += (P[i][0] === p[0] && P[i][1] === p[1]);
        });
        if (!best || c < best.total - 1e-9 || (Math.abs(c - best.total) < 1e-9 && held > best.held))
          best = { total: c, held, pairs: X.map((p, i) => [p, P[i]]) };
      }
    }
    best.moves = best.pairs.filter(([p, q]) => p[0] !== q[0] || p[1] !== q[1]).map(([p, q]) => ({
      from: NAMES[fret(p)], to: NAMES[fret(q)], fromF: fret(p), toF: fret(q),
      limit: oddLimit(q[0] - p[0], q[1] - p[1]), cost: kees(q[0] - p[0], q[1] - p[1]) }));
    return best;
  }

  // chord TD in 12-TET (chord_distance.td12): td's pairing, each move priced at its tempered size
  function td12(X, Y) {
    const t = td(X, Y), moves = t.moves.map(m => ({ ...m, cost12: PALETTE.etdFret[mod(m.toF - m.fromF, 12)] }));
    return { total: moves.reduce((a, m) => a + m.cost12, 0), moves, pure: t.total };
  }
  const group = (v, t) => (v <= 2 ? 'smooth' : 'leap') + ', ' + (t < 5.5 ? 'near' : t < 7.5 ? 'far' : 'remote');

  // every triad sharing a note with the given one, plus every chord of its key
  function neighbours(root, kind) {
    const X = chord(root, kind), fx = new Set(X.map(fret)), rows = [], key = keyOf(root, kind);
    for (let r = 0; r < 12; r++) for (const k of ['', 'm', '°']) {
      if (r === root && k === kind) continue;
      const Y = chord(r, k), shared = Y.map(fret).filter(f => fx.has(f)).length;
      const rn = key.get(`${r}|${k}`) || '';
      if (!((shared && k !== '°') || rn)) continue;
      const v = vl(X, Y), t = td(X, Y);
      rows.push({ root: r, kind: k, chord: name(r, k), key: rn, shared, vl: v.total, td: t.total,
        vlMoves: v.moves, tdMoves: t.moves, group: group(v.total, t.total) });
    }
    return rows;
  }
  // The key of a home triad and its neighbourhood (port of chord_distance.neighbourhood):
  // order 0 = the key's chords, 1 = triads sharing an edge (two notes) with one of them,
  // 2 = triads sharing a note with the key. Each gets one place on the grid.
  const W3 = L3, CS = L3 / (2 * L5), SN = Math.sqrt(1 - CS * CS);
  const xy = p => [p[0] * L3 + p[1] * L5 * CS, p[1] * L5 * SN];
  const tri = (k, a, b) => k === 'up' ? [[a, b], [a, b + 1], [a + 1, b]] : [[a, b + 1], [a + 1, b], [a + 1, b + 1]];
  const spell = (a, b) => { const n = a + 4 * b, acc = Math.floor((n + 1) / 7);
    return 'FCGDAEB'[mod(n + 1, 7)] + (acc > 0 ? '♯'.repeat(acc) : '♭'.repeat(-acc)); };
  const KEY_TRIS = [['up', 0, 0, 'I'], ['up', -1, 0, 'IV'], ['up', 1, 0, 'V'], ['dn', -1, 0, 'vi'], ['dn', 0, 0, 'iii'], ['dn', -2, 0, 'ii']];
  const MINOR_RN = { I: 'III', ii: 'iv', iii: 'v', IV: 'VI', V: 'VII', vi: 'i', 'vii°': 'ii°' };
  // scale degree of grid point p in the key of a home triad (natural minor for a minor home):
  // the letter gives the number, the fret gives the accidental, e.g. F♯ in C = ♯4̂, B♭ in A minor = ♭2̂
  const STEPS = { '': [0, 2, 4, 5, 7, 9, 11], m: [0, 2, 3, 5, 7, 8, 10] };
  function degreeOf(nm, f, root, kind) {          // scale degree of the note named nm at absolute fret f
    const t = chord(root, kind)[0], L = s => 'CDEFGAB'.indexOf(s[0]);
    const d = mod(L(nm) - L(spell(...t)), 7);
    const diff = mod(f - (root + STEPS[kind][d]) + 6, 12) - 6;
    return (diff > 0 ? '♯'.repeat(diff) : '♭'.repeat(-diff)) + (d + 1) + '̂';
  }
  const degree = (p, root, kind) => degreeOf(spell(...p), fret(p), root, kind);
  // every name a fret goes by: the grid's spelling first, then its enharmonic twin (G♯ / A♭, E♯ / F)
  const SHARP = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const FLAT = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
  function names(p) {
    const nm = spell(...p), f = fret(p);
    const alt = [SHARP[f], FLAT[f]].find(x => x !== nm);
    return alt && alt !== nm ? [nm, alt] : [nm];
  }
  // tonal distance of a pitch class (fret above the root) in 12-TET: the expected TD of that fret
  const pcTD = f => PALETTE.etdFret[mod(f, 12)];       // 12-TET (Appendix B)
  function neighbourhood(root, kind) {
    const X = chord(root, kind), M = kind === '' ? X[0] : [X[0][0] + 1, X[0][1] - 1];
    const rnOf = rn => kind === '' ? rn : MINOR_RN[rn];
    const keyTris = KEY_TRIS.map(([k, a, b, rn]) => [k, M[0] + a, M[1] + b, rnOf(rn)]);
    const vii = [[M[0] + 1, M[1] + 1], [M[0] + 2, M[1]], [M[0] + 3, M[1] - 1]];
    const id = p => p[0] + ',' + p[1];
    const keyPts = new Set(keyTris.flatMap(([k, a, b]) => tri(k, a, b).map(id)));
    const keySets = [...keyTris.map(([k, a, b]) => new Set(tri(k, a, b).map(fret))), new Set(vii.map(fret))];
    const keyPcs = new Set(keySets.flatMap(s => [...s]));
    const kp = [...keyPts].map(s => xy(s.split(',').map(Number)));
    const cx = kp.reduce((s, p) => s + p[0], 0) / kp.length, cy = kp.reduce((s, p) => s + p[1], 0) / kp.length;
    const placed = new Map();
    keyTris.forEach(([k, a, b, rn]) => placed.set(`${fret(tri(k, a, b)[0])}|${k === 'up' ? '' : 'm'}`, [0, rn, [k, a, b]]));
    placed.set(`${fret(vii[0])}|°`, [0, rnOf('vii°'), ['dim', ...vii[0]]]);
    const todo = [];
    for (let r = 0; r < 12; r++) for (const q of ['', 'm']) {
      if (placed.has(`${r}|${q}`)) continue;
      const pcs = new Set((q === '' ? [0, 4, 7] : [0, 3, 7]).map(d => (r + d) % 12));
      const order = Math.max(...keySets.map(ks => [...pcs].filter(x => ks.has(x)).length)) >= 2 ? 1
        : [...pcs].some(x => keyPcs.has(x)) ? 2 : 3;               // 3: shares no note with the key
      todo.push([order, r, q]);
    }
    todo.sort((x, y) => x[0] - y[0] || x[1] - y[1] || (x[2] < y[2] ? -1 : x[2] > y[2] ? 1 : 0));
    for (const [order, r, q] of todo) {
      // third-order chords touch no key point; place them against the chords already placed
      const near = new Set(order === 3 ? [...placed.values()].filter(v => v[2][0] !== 'dim').flatMap(v => tri(...v[2]).map(id)) : []);
      const rowsB = new Set([...near].map(s => +s.split(',')[1]));      // stay inside the rows already in use
      const k = q === '' ? 'up' : 'dn';
      let best = null;
      for (let a = M[0] - 9; a <= M[0] + 9; a++) for (let b = M[1] - 4; b <= M[1] + 4; b++) {
        const pts = tri(k, a, b);
        if (fret(pts[0]) !== r) continue;
        const c = pts.map(xy), mx = (c[0][0] + c[1][0] + c[2][0]) / 3 - cx, my = (c[0][1] + c[1][1] + c[2][1]) / 3 - cy;
        const sc = [-pts.filter(p => keyPts.has(id(p))).length, near.size ? pts.filter(p => !rowsB.has(p[1])).length : 0, -pts.filter(p => near.has(id(p))).length, mx * mx + my * my];
        const lt = (u, w) => { for (let i = 0; i < u.length; i++) if (u[i] !== w[i]) return u[i] < w[i]; return false; };
        if (!best || lt(sc, best[0])) best = [sc, [k, a, b]];
      }
      placed.set(`${r}|${q}`, [order, '', best[1]]);
    }
    const fx = new Set(X.map(fret)), rows = [];
    const keyChords = [...placed].filter(([, v]) => v[0] === 0).map(([k]) => { const [r, q] = k.split('|'); return chord(+r, q); });
    placed.forEach(([order, rn, place], key) => {
      const [r, q] = key.split('|'), Y = chord(+r, q), v = vl(X, Y), t = td(X, Y), t12 = td12(X, Y).total;
      const tdKey = Math.min(...keyChords.map(K => td(K, Y).total));    // TD to the nearest chord of the key
      rows.push({ root: +r, kind: q, order, key: rn, home: +r === root && q === kind, place,
        chord: q === '°' ? name(+r, q) : spell(...tri(...place)[0]) + q,
        alt: q === '°' ? '' : (names(tri(...place)[0])[1] || '') && names(tri(...place)[0])[1] + q,
        shared: Y.map(fret).filter(f => fx.has(f)).length, vl: v.total, td: t.total, tdKey, td12: t12,
        vlMoves: v.moves, tdMoves: t.moves, group: group(v.total, t12) });
    });
    return rows.sort((a, b) => a.order - b.order || a.td12 - b.td12 || a.vl - b.vl || a.chord.localeCompare(b.chord));
  }
  // the torus tile around the key (chord_distance.tile): every chord once; copies outside it are dimmed
  function tile(rows) {
    const key = rows.filter(r => r.order === 0 && r.place[0] !== 'dim').map(r => r.place);
    const b0 = key[0][2], a0 = Math.min(...key.filter(p => p[0] === 'up').map(p => p[1]));
    const row = (b, a, k) => { const out = [];
      while (out.length < 9) { out.push([k, a, b].join(',')); [k, a] = k === 'up' ? ['dn', a] : ['up', a + 1]; }
      return out; };
    return new Set([...row(b0 - 1, a0 - 1, 'up'), ...key.map(p => p.join(',')), ...row(b0 + 1, a0 - 2, 'dn')]);
  }
  // the shared colour code (chord_distance.colour), two modes, both "deep = close":
  // The book's shared visual code (chord_distance.ENCODING; PALETTE is written by chord_distance.py).

      Object.values(spots).forEach(rs => rs.sort((a, b) => a.chord.localeCompare(b.chord)).forEach((r, i) => {
        const cx = X(r.vl) + (i - (rs.length - 1) / 2) * (rs.some(x => x.key) ? 56 : 32), cy = Y(r.td12), s = 9;
        const pts = r.kind === 'm' ? `${cx - s},${cy - s * 0.7} ${cx + s},${cy - s * 0.7} ${cx},${cy + s}`
          : r.kind === '°' ? `${cx},${cy - s} ${cx + s * 0.8},${cy} ${cx},${cy + s} ${cx - s * 0.8},${cy}`
          : `${cx - s},${cy + s * 0.7} ${cx + s},${cy + s * 0.7} ${cx},${cy - s}`;
        const g = S('g', { class: 'pt' });
        g.append(S('circle', { cx, cy, r: 18, class: 'hit' }));
        const fc = paintShape(g, pat, pts, r.vl, r.td12);
        g.append(S('polygon', { points: pts, fill: 'none', stroke: r.key ? '#000' : fc, 'stroke-width': r.key ? 2.5 : 1.2 }));
        const t = S('text', { x: cx, y: cy - 14, class: 'pl', 'text-anchor': 'middle' }); t.textContent = r.chord + (r.key ? ` (${r.key})` : ''); g.append(t);
        g.addEventListener('mouseenter', () => {
          tip.innerHTML = `<b>${CD.name(r0, k0)} → ${r.chord}</b>${r.key ? ' (' + r.key + ')' : ''} · shares ${r.shared}<br>VL ${r.vl}: ${fmtVL(r.vlMoves)}<br>TD ${r.td12.toFixed(2)} in 12-TET (pure ${r.td.toFixed(2)}): ${fmtTD(r.tdMoves)}`;
          tip.style.left = `${cx / W * 100}%`; tip.style.top = `${cy / H * 100}%`; tip.classList.add('on');
        });
        g.addEventListener('mouseleave', () => tip.classList.remove('on'));
        g.addEventListener('click', () => calculators.forEach(c => c.set(sel.value, `${r.root}|${r.kind}`)));
        svg.append(g);
      }));
      table.replaceChildren(el('thead', {}, el('tr', {}, ...['Chord', 'In key', 'Order', 'Shared with home', 'VL', 'VL moves', 'TD (12-TET)', 'TD (pure)', 'TD moves (odd limit)', 'TD to key', 'Group'].map(h => el('th', {}, h)))),
        el('tbody', {}, ...rows.sort((a, b) => a.td - b.td || a.vl - b.vl).map(r => el('tr', {},
          el('td', {}, r.chord + (r.alt ? ' / ' + r.alt : '')), el('td', {}, r.key), el('td', {}, String(r.order)), el('td', {}, String(r.shared)), el('td', {}, String(r.vl)), el('td', {}, fmtVL(r.vlMoves)),
          el('td', {}, r.td12.toFixed(2)), el('td', {}, r.td.toFixed(2)), el('td', {}, fmtTD(r.tdMoves)), el('td', {}, r.tdKey.toFixed(2)), el('td', {}, r.group)))));
      makeSortable(table);
      legendBox.replaceChildren(...colourLegend('in the key  ·  ▲ major ▼ minor ◆ diminished'));
    };
    sel.addEventListener('change', render);
    rerenders.push(render);
    render();
  }

  // ---------------------------------------------------------------- neighbourhood scope
  // how far out from the key the distance charts colour and label: 0 key, 1 + edge, 2 + note
  let scope = 3;
  const scopeSelects = [];
  const SCOPES = [['0', 'the key only'], ['1', '+ chords sharing an edge with the key (1st order)'], ['2', '+ chords sharing a note with the key (2nd order)'], ['3', '+ the rest, sharing no note (3rd order): every chord']];
  const scopeSelect = () => {
    const s = el('select');
    SCOPES.forEach(([v, lab]) => { const o = el('option', { value: v }, lab); if (+v === scope) o.selected = true; s.append(o); });
    s.addEventListener('change', () => { scope = +s.value; scopeSelects.forEach(x => { x.value = s.value; }); rerenders.forEach(r => r()); });
    scopeSelects.push(s);
    return s;
  };
  const ORDER = ['key', '1st: shares an edge', '2nd: shares a note', '3rd: shares no note'];

  // ---------------------------------------------------------------- neighbourhood map (grid)
  // The home chord's key and its neighbourhood on the flat grid (port of key_neighbours.grid).
  // Click a coloured chord: it becomes home (with its own key) and the move joins the trail.
  function neighbourMap(host) {
    const S = (tag, attrs, text) => { const e = sv(tag, attrs); if (text != null) e.textContent = text; return e; };
    const sel = chordSelect(host.dataset.from || '0|');
    const reset = el('button', { class: 'nm-btn' }, 'Clear trail');
    const trail = el('div', { class: 'nm-trail' });
    const svg = S('svg', { class: 'nm-svg' });
    const legendBox = el('div', { class: 'cd-legend' });
    const tip = el('div', { class: 'cd-tip' });
    host.append(el('div', { class: 'cd-row' }, el('label', {}, 'Home chord ', sel), el('label', {}, 'Show ', scopeSelect()), reset),
      el('div', { class: 'cd-hint' }, 'Click a coloured chord to move there; hover for its moves.'),
      legendBox, trail, el('div', { class: 'cd-plot' }, svg, tip));
    let path = [];
    const showTrail = () => {
      const tv = path.reduce((s, x) => s + x.vl, 0), tt = path.reduce((s, x) => s + x.td, 0);
      trail.textContent = path.length ? `Progression: ${path[0].from} → ${path.map(x => `${x.name} (${x.vl} | ${x.td.toFixed(1)})`).join(' → ')}   ·   total VL ${tv}, TD ${tt.toFixed(1)}`
        : 'Progression: click a chord to start.';
    };
    reset.addEventListener('click', () => { path = []; showTrail(); });
    const id = p => p[0] + ',' + p[1];

    function render() {
      const [r0, k0] = parse(sel.value), nm = CD.name(r0, k0);
      const rows = CD.neighbourhood(r0, k0), tris = rows.filter(r => r.place[0] !== 'dim');
      const homePts = new Set(CD.chord(r0, k0).map(id));
      const allp = tris.flatMap(r => CD.tri(...r.place));
      const b0 = Math.min(...allp.map(p => p[1])), b1 = Math.max(...allp.map(p => p[1]));
      const X0 = Math.min(...allp.map(p => CD.xy(p)[0])) - 0.2, X1 = Math.max(...allp.map(p => CD.xy(p)[0])) + 0.2;
      const pts = [], has = new Set();
      for (let b = b0; b <= b1; b++) for (let a = -30; a <= 30; a++) { const x = CD.xy([a, b])[0]; if (x >= X0 && x <= X1) { pts.push([a, b]); has.add(id([a, b])); } }
      const P = p => { const [x, y] = CD.xy(p); return [x, -y]; };
      const xs = pts.map(p => P(p)[0]), ys = pts.map(p => P(p)[1]);
      const minx = Math.min(...xs) - 0.5, miny = Math.min(...ys) - 0.5;
      svg.setAttribute('viewBox', `${minx} ${miny} ${Math.max(...xs) + 1.9 - minx} ${Math.max(...ys) + 0.95 - miny}`);
      svg.replaceChildren();
      const fs = 0.2, pat = patternDefs(svg, 0.17);
      // every whole triangle in the window that is the same chord (same frets) as a row is painted:
      // on a guitar a comma copy is the same chord, so it gets the same colour and label
      const byId = new Map(tris.map(r => [`${r.root}|${r.kind}`, r]));
      const T = CD.tile(rows);           // the whole-map tile: every chord once; other copies are faded (Zahid 2026-10-19)
      const shown = [];
      for (let b = b0 - 1; b <= b1; b++) for (let a = -30; a <= 30; a++) ['up', 'dn'].forEach(k => {
        const q = CD.tri(k, a, b);
        if (!q.every(p => has.has(id(p)))) return;
        const r = byId.get(`${CD.fret(q[0])}|${k === 'up' ? '' : 'm'}`);
        if (r && r.order <= scope) shown.push({ ...r, place: [k, a, b], star: r.home && q.every(p => homePts.has(id(p))), rep: !T.has([k, a, b].join(',')) });
      });
      shown.forEach(r => {
        const c = CD.tri(...r.place).map(P), cx = (c[0][0] + c[1][0] + c[2][0]) / 3, cy = (c[0][1] + c[1][1] + c[2][1]) / 3;
        const g = S('g', { class: r.home ? '' : 'nm-t' });
        const fc = paintShape(g, pat, c.map(q => q.join(',')).join(' '), r.home ? 0 : r.vl, r.home ? 0 : r.td12, { stroke: 'none', 'stroke-width': fs * 0.1 });
        const dark = CD.inkOf(fc).startsWith('rgba(255');
        const lab = { fill: dark ? '#ffffff' : '#111827', 'text-anchor': 'middle' };
        if (r.star) g.append(S('text', { x: cx, y: cy - fs * 1.1, 'font-size': fs * 1.4, 'text-anchor': 'middle', fill: '#d69e2e' }, '★'));
        const cn = CD.names(CD.tri(...r.place)[0]).map(n => n + r.kind).join(' / ');   // both names if the root has two
        g.append(S('text', { x: cx, y: cy, 'font-size': cn.includes('/') ? fs * 0.85 : fs, 'font-weight': 700, ...lab }, cn + (r.key ? ` (${r.key})` : '')));
        g.append(S('text', { x: cx, y: cy + fs * 0.95, 'font-size': fs * 0.68, 'font-weight': 500, ...lab }, r.home ? 'home' : `${r.vl} | ${r.td12.toFixed(1)}`));
        if (r.rep) g.append(S('polygon', { points: c.map(q => q.join(',')).join(' '), fill: '#fff', 'fill-opacity': 0.62, 'pointer-events': 'none' }));
        if (!r.home) {
          g.addEventListener('mouseenter', () => {
            const hb = svg.parentNode.getBoundingClientRect(), m = svg.getScreenCTM(), pt = svg.createSVGPoint();
            pt.x = cx; pt.y = cy; const sp = pt.matrixTransform(m);
            tip.innerHTML = `<b>${nm} → ${r.chord}${r.alt ? ' / ' + r.alt : ''}</b>${r.key ? ' (' + r.key + ')' : ''} · ${ORDER[r.order]}<br>VL ${r.vl}: ${fmtVL(r.vlMoves)}<br>TD ${r.td12.toFixed(2)} in 12-TET (pure ${r.td.toFixed(2)}): ${fmtTD(r.tdMoves)}`;
            tip.style.left = `${sp.x - hb.left}px`; tip.style.top = `${sp.y - hb.top}px`; tip.classList.add('on');
          });
          g.addEventListener('mouseleave', () => tip.classList.remove('on'));
          g.addEventListener('click', () => {
            tip.classList.remove('on');
            path.push({ from: nm, name: r.chord, vl: r.vl, td: r.td12 });
            calculators.forEach(cl => cl.set(sel.value, `${r.root}|${r.kind}`));
            sel.value = `${r.root}|${r.kind}`; showTrail(); render();
          });
        }
        svg.append(g);
      });
      // outlines: the key (bold black) and, when shown, the key plus its edge neighbours (dashed)
      const outline = (places, attrs) => {
        const cnt = new Map();
        places.forEach(pl => { const q = CD.tri(...pl);
          [[q[0], q[1]], [q[1], q[2]], [q[2], q[0]]].forEach(e => { const k = e.map(id).sort().join('|'); cnt.set(k, [...(cnt.get(k) || []), e]); }); });
        cnt.forEach(es => { if (es.length !== 1) return; const [[x1, y1], [x2, y2]] = es[0].map(P);
          svg.append(S('line', { x1, y1, x2, y2, 'stroke-linecap': 'round', ...attrs })); });
      };
      // every edge of the grid: solid = fifth or major third, dotted = minor third (drawn over the fills)
      pts.forEach(([a, b]) => [[1, 0, false], [0, 1, false], [1, -1, true]].forEach(([da, db, dot]) => {
        if (!has.has(id([a + da, b + db]))) return;
        const [x1, y1] = P([a, b]), [x2, y2] = P([a + da, b + db]);
        svg.append(S('line', { x1, y1, x2, y2, stroke: '#2d3748', 'stroke-opacity': 0.8, 'stroke-width': fs * (dot ? 0.1 : 0.05), 'stroke-linecap': 'round', 'stroke-dasharray': dot ? `0 ${fs * 0.2}` : '', 'pointer-events': 'none' }));
      }));
      outline(tris.filter(r => r.order === 0).map(r => r.place), { stroke: '#000', 'stroke-width': fs * 0.34 });
      // the key's tritone (Zahid 2026-10-12: the thin chain was hard to see): a broad translucent red
      // band along vii° (ii° in minor), the ↘↘ chain, and red rings on its two ends, the tritone itself
      const v7 = rows.find(r => r.place[0] === 'dim'), [, va, vb] = v7.place;
      const cp = [0, 1, 2].map(i => P([va + i, vb - i]));
      svg.append(S('polyline', { points: cp.map(p => p.join(',')).join(' '), fill: 'none', stroke: '#e53e3e', 'stroke-opacity': 0.32, 'stroke-width': fs * 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'none' }));
      const tt = [CD.spell(va, vb), CD.spell(va + 2, vb - 2)];
      const lx = cp[2][0] + 0.48, ly = cp[2][1] + 0.5;              // below the chain's lower end, clear of the chords
      [[`${v7.chord} (${v7.key})`, 0, fs, 700, '#111827'], [`tritone ${tt[0]}–${tt[1]}`, 1, fs * 0.72, 700, '#c53030'], [`${v7.vl} | ${v7.td12.toFixed(1)}`, 2, fs * 0.68, 500, '#111827']].forEach(([txt, i, f, w, c]) => svg.append(S('text', { x: lx, y: ly + fs * (i * 0.95 - 0.2), 'font-size': f, 'font-weight': w, fill: c, 'text-anchor': 'start' }, txt)));
      const ttEnds = new Set([id([va, vb]), id([va + 2, vb - 2])]);
      const used = new Set([...shown.filter(r => !r.rep).flatMap(r => CD.tri(...r.place).map(id)), ...[0, 1, 2].map(i => id([va + i, vb - i]))]);
      const [ah, bh] = CD.chord(r0, k0)[0];
      // each note: name (scale degree), one line per name if the fret has two, then VL | TD from the home root
      pts.forEach(([a, b]) => { const [x, y] = P([a, b]), on = used.has(id([a, b])), nr = 0.4;
        const f = CD.fret([a - ah, b - bh]), v = Math.min(f, 12 - f), t = CD.pcTD(f);   // 12-TET: one TD per fret
        const ink = on ? '#1a202c' : '#a0aec0', mute = on ? '#52514e' : '#b8c2d0';
        const root = a === ah && b === bh;                         // the key's root note: the only star
        const nms = CD.names([a, b]), fa = CD.fret([a, b]);        // a fret with two names shows both
        // the note itself can carry the code too (Display: "Colour the notes"); the text then contrasts
        const paintNote = CD.ENC.note_colour && on;
        let fillN = '#fff';
        if (paintNote) {
          fillN = CD.colourOf(v, t);
          svg.append(S('circle', { cx: x, cy: y, r: nr, fill: fillN, stroke: '#fff', 'stroke-width': nr * 0.08 }));
          const lv = CD.level(v, t);
          if (lv) svg.append(S('circle', { cx: x, cy: y, r: nr, fill: pat(lv, fillN), 'pointer-events': 'none' }));
        } else svg.append(S('circle', { cx: x, cy: y, r: nr, fill: '#fff', stroke: on ? '#a0aec0' : '#d5dbe3', 'stroke-width': nr * 0.06 }));
        // text: white on dark and saturated mid-tone fills (relative luminance < 0.3), else near-black
        const relL = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
          .map(u => u <= 0.03928 ? u / 12.92 : ((u + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
        const darkN = paintNote && relL(fillN) < 0.3;          // saturated mid-tones read better in white
        const inkN = paintNote ? (darkN ? '#ffffff' : '#111827') : ink, muteN = paintNote ? inkN : mute;
        if (root) svg.append(S('text', { x, y: y - nr * 1.08, 'font-size': fs * 1.5, 'text-anchor': 'middle', fill: '#d69e2e', stroke: '#fff', 'stroke-width': fs * 0.1, 'paint-order': 'stroke' }, '★'));
        const lines = nms.map(n => `${n} (${CD.degreeOf(n, fa, r0, k0)})`), y0 = lines.length === 1 ? -0.12 : -0.36;
        lines.forEach((ln, i) => svg.append(S('text', { x, y: y + nr * (y0 + i * 0.4), 'font-size': fs * 0.58, 'font-weight': 600, fill: inkN, 'text-anchor': 'middle' }, ln)));
        svg.append(S('text', { x, y: y + nr * (lines.length === 1 ? 0.36 : 0.56), 'font-size': fs * 0.48, fill: muteN, 'text-anchor': 'middle' }, `${v} | ${t.toFixed(1)}`));
        if (ttEnds.has(id([a, b]))) svg.append(S('circle', { cx: x, cy: y, r: nr * 1.14, fill: 'none', stroke: '#e53e3e', 'stroke-width': nr * 0.16 })); });
      legendBox.replaceChildren(...colourLegend(`the key (${k0 === 'm' ? 'natural minor' : 'major'})  ·  faded: a repeat (the rest is the whole map, every chord once)  ·  red band and rings: the key's tritone (vii°)  ·  edges: solid = 5th or major 3rd, dotted = minor 3rd  ·  chord: name (numeral), VL | TD  ·  note: name (scale degree), both names if the fret has two, VL | TD from the home root`));
    }
    rerenders.push(render);
    sel.addEventListener('change', () => { path = []; showTrail(); render(); });
    showTrail(); render();
  }

  // ---------------------------------------------------------------- display settings
  // inline where the code is first introduced, and a floating panel reachable from anywhere
  function settingsWidget(host) {
    const demo = el('div', { class: 'cd-legend' });
    host.append(el('div', { class: 'enc-title' }, 'Display settings for every distance chart in this book'), settingsForm(), demo);
    const render = () => demo.replaceChildren(...colourLegend('in the key'));
    rerenders.push(render); render();
  }
  document.querySelectorAll('[data-widget="display-settings"]').forEach(settingsWidget);
  if (document.querySelector('[data-widget]')) {
    const panel = el('div', { id: 'enc-panel' }, el('div', { class: 'enc-title' }, 'Display settings'), settingsForm());
    const btn = el('button', { id: 'enc-btn', type: 'button', title: 'Colour map and pattern for every distance chart' }, '🎨 Display');
    btn.addEventListener('click', () => panel.classList.toggle('on'));
    document.body.append(panel, btn);
  }

  document.querySelectorAll('[data-widget="chord-distance"]').forEach(calculator);
  document.querySelectorAll('[data-widget="neighbour-map"]').forEach(neighbourMap);
  document.querySelectorAll('[data-widget="chord-neighbours"]').forEach(neighboursChart);
});

if (typeof module !== 'undefined') module.exports = CD;
</script></body></html>
